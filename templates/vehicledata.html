<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehicle Insurance Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body style="background:#f4f7fb;">

    <div class="container mt-5 mb-5">

        <div class="card shadow-lg p-4">

            <h2 class="text-center mb-4 text-primary">
                🚗 Vehicle Insurance Prediction
            </h2>

            <form action="/" method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Gender</label>
                        <select class="form-select" name="Gender" required>
                            <option value="">Select Gender</option>
                            <option value="1">Male</option>
                            <option value="0">Female</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Age</label>
                        <input type="number"
                               class="form-control"
                               name="Age"
                               placeholder="Enter Age"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Driving License</label>
                        <select class="form-select" name="Driving_License" required>
                            <option value="">Select</option>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Region Code</label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="Region_Code"
                               placeholder="e.g. 28"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Previously Insured</label>
                        <select class="form-select" name="Previously_Insured" required>
                            <option value="">Select</option>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Annual Premium</label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="Annual_Premium"
                               placeholder="Annual Premium"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Policy Sales Channel</label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="Policy_Sales_Channel"
                               placeholder="Policy Sales Channel"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Vintage</label>
                        <input type="number"
                               class="form-control"
                               name="Vintage"
                               placeholder="Vehicle Age in Days"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Vehicle Age &lt; 1 Year</label>
                        <select class="form-select" name="Vehicle_Age_lt_1_Year" required>
                            <option value="">Select</option>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Vehicle Age &gt; 2 Years</label>
                        <select class="form-select" name="Vehicle_Age_gt_2_Years" required>
                            <option value="">Select</option>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Vehicle Damaged Before?</label>
                        <select class="form-select" name="Vehicle_Damage_Yes" required>
                            <option value="">Select</option>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                </div>

                <div class="d-grid mt-3">
                    <button class="btn btn-primary btn-lg" type="submit">
                        Predict Insurance Interest
                    </button>
                </div>

            </form>

            <hr>

            <div class="d-grid">
                <form action="/train" method="GET">
                    <button class="btn btn-success btn-lg">
                        Train Model
                    </button>
                </form>
            </div>

            {% if context %}

            <div class="alert alert-info text-center mt-4">

                <h4>Prediction Result</h4>

                {% if context == "Response-Yes" %}

                <h2 class="text-success">
                    ✅ Customer is Interested in Vehicle Insurance
                </h2>

                {% elif context == "Response-No" %}

                <h2 class="text-danger">
                    ❌ Customer is Not Interested in Vehicle Insurance
                </h2>

                {% else %}

                <h2>{{ context }}</h2>

                {% endif %}

            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
