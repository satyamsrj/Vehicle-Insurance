<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehicle Insurance Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body style="background:#f4f7fb;">

    <div class="container mt-5 mb-5">

        <div class="card shadow-lg p-4">

            <h2 class="text-center mb-4 text-primary">
                🚗 Vehicle Insurance Prediction
            </h2>

            <form action="/" method="POST">

                <!-- form fields remain unchanged -->

                <div class="d-grid mt-3">
                    <button class="btn btn-primary btn-lg" type="submit">
                        Predict Insurance Interest
                    </button>
                </div>

            </form>

            {% if context %}

            <div class="alert alert-info text-center mt-4">

                <h4>Prediction Result</h4>

                {% if context == "Response-Yes" %}
                <h2 class="text-success">
                    ✅ Customer is Interested in Vehicle Insurance
                </h2>
                {% elif context == "Response-No" %}
                <h2 class="text-danger">
                    ❌ Customer is Not Interested in Vehicle Insurance
                </h2>
                {% else %}
                <h2>{{ context }}</h2>
                {% endif %}

            </div>

            {% endif %}

        </div>

    </div>

</body>
</html>
